name: 📦 Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"      # data changes reach the app live — no new APK needed
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk halal.apk

      - name: Publish GitHub Release (the app updates itself from here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Halal 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          files: halal.apk
          make_latest: true
