name: 📦 Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"      # data changes reach the app live — no new APK needed
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME" ; ls "$ANDROID_HOME/platforms" || echo "::error::no Android SDK on runner"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            # show errors as annotations (readable without log download)
            grep -E "^e: |error:|What went wrong|FAILURE|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk halal.apk

      - name: Publish GitHub Release (the app updates itself from here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Halal 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          files: halal.apk
          make_latest: true
